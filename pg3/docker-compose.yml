version: '3.8'

# 🚀 ANTIGRAVITY DOCKER STACK
# Run with: docker-compose up -d

services:
  # 🗄️ REDIS - Job Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: antigravity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📊 BULL-BOARD - Queue Dashboard (http://localhost:3001)
  bull-board:
    image: venatum/bull-board
    container_name: antigravity-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  # 🌐 ENRICHER WORKER
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /app/data/antigravity.db
      START_HEALTH_SERVER: "true"
      ENABLE_PROMETHEUS_METRICS: "true"
      HEALTH_PORT: 3000
      METRICS_PORT: 9091
    ports:
      - "3000:3000"
      - "9091:9091"
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  # 🗓️ SCHEDULER SINGLETON
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-scheduler
    profiles: ["scheduler"]
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/src/index.js", "scheduler"]
    environment:
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /app/data/antigravity.db
      SCHEDULER_INPUT_FILE: /app/output/campaigns/BOARD_FINAL_SANITISED.csv
    volumes:
      - ./data:/app/data
      - ./output:/app/output

volumes:
  redis_data:
    driver: local
